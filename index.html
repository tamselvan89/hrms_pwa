<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NKT HRMS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- apple-touch-icon paths are relative to the HTML file; Vite rewrites them with base -->
    <link rel="apple-touch-icon" href="/punch/icons/ios/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/punch/icons/ios/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/punch/icons/ios/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/punch/icons/ios/apple-touch-icon-120.png" />

    <link rel="manifest" href="manifest.webmanifest" />
    <title>Netkathir HRMS</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Capture beforeinstallprompt before any module script loads -->
    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new Event('pwaPromptReady'));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
